[project]
name = "tl_towerwatch"
version = "1.3.0"
description = "Local PR dashboard with manual review prompts and per-skill prompt editor"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "David", email = "dimh@example.com" }]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.3",
]

[project.scripts]
tl_towerwatch = "tl_towerwatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_towerwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.16 broadened its default rule set. Pin the rules this project was
# actually linted against so a tool upgrade cannot silently turn `make check`
# red (or green) without a visible config change.
select = ["E4", "E7", "E9", "F"]